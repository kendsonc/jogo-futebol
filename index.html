<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modo Carreira: A Jornada</title>
<style>
  /* ===================== RESET & BASE ===================== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --club-c1: #2a9d6f;
    --club-c2: #3fc98a;
    --bg-base: #0d1117;
  }
  * { scrollbar-color: #2a3140 transparent; }
  html, body {
    height: 100%;
    background: var(--bg-base);
    color: #e6e9ef;
    font-family: 'Segoe UI', 'Trebuchet MS', Arial, sans-serif;
    line-height: 1.5;
  }
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    background:
      radial-gradient(1100px circle at 12% -12%, transparent, transparent),
      radial-gradient(900px circle at 105% 105%, transparent, transparent),
      var(--bg-base);
    transition: background 1.2s ease;
  }
  body.tema-clube {
    background:
      radial-gradient(1100px circle at 12% -12%, color-mix(in srgb, var(--club-c1) 24%, transparent), transparent 60%),
      radial-gradient(900px circle at 105% 105%, color-mix(in srgb, var(--club-c2) 20%, transparent), transparent 60%),
      var(--bg-base);
  }
  #app { flex: 1; display: flex; flex-direction: column; max-width: 900px; margin: 0 auto; width: 100%; padding: 16px; }
  #app.fade-in { animation: telaEntrada .4s cubic-bezier(.22,.75,.35,1); }
  @keyframes telaEntrada {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  h1, h2, h3 { font-weight: 600; letter-spacing: .3px; }
  a { color: inherit; }
  button, select, input {
    font-family: inherit;
    font-size: 15px;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #2a3140; border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ===================== LAYOUT HELPERS ===================== */
  .hidden { display: none !important; }
  .card {
    position: relative;
    background: linear-gradient(180deg, rgba(255,255,255,.03) 0%, transparent 40%), linear-gradient(180deg, #151b26 0%, #121722 100%);
    border: 1px solid #232b3a;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: 0 4px 18px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.03);
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, #2a3140, #2a3140);
  }
  body.tema-clube .card::before {
    background: linear-gradient(90deg, var(--club-c1), var(--club-c2));
  }
  .card-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #7c8aa5;
    margin-bottom: 10px;
  }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .col { flex: 1 1 200px; min-width: 0; }
  .center { text-align: center; }
  .muted { color: #8a94a8; font-size: 13px; }
  .small { font-size: 12px; }
  .spacer { height: 12px; }

  /* ===================== BUTTONS ===================== */
  .btn {
    display: inline-block;
    background: #1e2838;
    color: #e6e9ef;
    border: 1px solid #2f3b4f;
    border-radius: 10px;
    padding: 12px 16px;
    cursor: pointer;
    text-align: left;
    transition: transform .12s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;
    width: 100%;
  }
  .btn:hover { background: #243145; border-color: #3d5271; transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.28); }
  .btn:active { transform: translateY(0); box-shadow: none; }
  .btn-primary { background: linear-gradient(135deg, #1f6f4f, #237a57); border-color: #2a9d6f; font-weight: 600; }
  .btn-primary:hover { background: linear-gradient(135deg, #24875f, #29996a); }
  body.tema-clube .btn-primary { background: linear-gradient(135deg, var(--club-c1), color-mix(in srgb, var(--club-c2) 55%, var(--club-c1))); border-color: color-mix(in srgb, var(--club-c1) 60%, white 10%); }
  .btn-danger { background: #5a1f24; border-color: #8a2e35; }
  .btn-danger:hover { background: #712831; }
  .btn-ghost { background: transparent; }
  .btn-small { width: auto; padding: 6px 12px; font-size: 13px; border-radius: 8px; }
  .btn-row { display: flex; flex-direction: column; gap: 10px; }
  .choices { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .choices .btn { animation: escolhaEntra .3s ease backwards; }
  .choices .btn:nth-child(1){ animation-delay: .02s; } .choices .btn:nth-child(2){ animation-delay: .06s; }
  .choices .btn:nth-child(3){ animation-delay: .10s; } .choices .btn:nth-child(4){ animation-delay: .14s; }
  .choices .btn:nth-child(5){ animation-delay: .18s; } .choices .btn:nth-child(6){ animation-delay: .22s; }
  @keyframes escolhaEntra { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }

  /* ===================== FORMS ===================== */
  label { display: block; font-size: 13px; color: #9aa5ba; margin-bottom: 4px; margin-top: 10px; }
  input[type=text], input[type=number], select {
    width: 100%;
    background: #0f141d;
    border: 1px solid #2a3140;
    color: #e6e9ef;
    border-radius: 8px;
    padding: 9px 10px;
  }
  input:focus, select:focus { outline: none; border-color: #3d7bd6; }
  fieldset { border: 1px solid #232b3a; border-radius: 10px; padding: 12px; margin-top: 14px; }
  legend { padding: 0 8px; color: #7c8aa5; font-size: 13px; text-transform: uppercase; letter-spacing: .5px; }

  /* ===================== BARS / BADGES ===================== */
  .bar-label { display: flex; justify-content: space-between; font-size: 12px; color: #9aa5ba; margin-bottom: 3px; }
  .bar-track { background: #0f141d; border: 1px solid #232b3a; border-radius: 6px; height: 10px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg,#2a9d6f,#3fc98a); }
  .bar-fill.warn { background: linear-gradient(90deg,#c98a2a,#e0ab3f); }
  .bar-fill.danger { background: linear-gradient(90deg,#a8323a,#d64550); }
  .bar-fill.info { background: linear-gradient(90deg,#2a6bc9,#3f9be0); }
  .attr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; }
  @media (max-width: 560px) { .attr-grid { grid-template-columns: 1fr; } }
  .badge {
    display: inline-block;
    background: #1e2838;
    border: 1px solid #2f3b4f;
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 12px;
    color: #b7c2d6;
    margin: 2px 4px 2px 0;
  }
  .badge.good { border-color: #2a9d6f; color: #7fe0b8; }
  .badge.bad { border-color: #a8323a; color: #f19aa0; }

  /* ===================== HEADER / STATUS BAR ===================== */
  #status-bar {
    display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
    background: linear-gradient(180deg, rgba(255,255,255,.03), transparent), #10151f;
    border: 1px solid #232b3a; border-top: 2px solid #2a3140; border-radius: 12px;
    padding: 10px 14px; margin-bottom: 14px; font-size: 13px;
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
  }
  body.tema-clube #status-bar { border-top-color: var(--club-c1); }
  #status-bar .sb-item { display: flex; flex-direction: column; min-width: 62px; }
  #status-bar .sb-item b { font-size: 13px; color: #e6e9ef; }
  #status-bar .sb-item span.lbl { color: #7c8aa5; font-size: 11px; text-transform: uppercase; }
  #status-bar .sb-divider { width: 1px; align-self: stretch; background: #232b3a; }
  #status-bar .sb-panel-btn { margin-left: auto; }

  /* ===================== TABS (PAINEL) ===================== */
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .tab-btn {
    background: #151b26; border: 1px solid #232b3a; color: #9aa5ba;
    border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: 13px;
  }
  .tab-btn.active { background: #1f6f4f; border-color: #2a9d6f; color: #fff; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ===================== MODAL (PAINEL OVERLAY) ===================== */
  #panel-overlay {
    position: fixed; inset: 0; background: rgba(4,6,10,.75);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 24px 12px; overflow-y: auto; z-index: 50;
  }
  #panel-modal {
    background: #0f141d; border: 1px solid #232b3a; border-radius: 14px;
    padding: 18px; width: 100%; max-width: 820px;
  }
  #panel-modal .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }

  /* ===================== NEWS FEED ===================== */
  .news-item {
    border-left: 3px solid #2f3b4f; padding: 8px 10px; margin-bottom: 8px;
    background: #10151f; border-radius: 0 8px 8px 0; font-size: 13px;
  }
  .news-item.torcida { border-color: #2a9d6f; }
  .news-item.midia { border-color: #3f9be0; }
  .news-item.familia { border-color: #e0ab3f; }
  .news-item.treinador { border-color: #a8323a; }
  .news-item .news-tag { font-size: 10px; text-transform: uppercase; color: #7c8aa5; letter-spacing: .5px; display:block; margin-bottom:2px; }

  /* ===================== NARRATIVE ===================== */
  #scene-text { font-size: 15.5px; line-height: 1.7; white-space: pre-line; letter-spacing: .1px; }
  #scene-text .fala { color: #cfe0ff; font-style: italic; }
  .card h2 { margin-bottom: 12px; }
  .card-title + h2, .card-title + #scene-text { margin-top: 2px; }
  .trace-tag { display:inline-block; font-size:11px; color:#7c8aa5; background:#151b26; border:1px solid #232b3a; border-radius:999px; padding:2px 9px; margin-bottom:10px; }

  footer { text-align: center; color: #4d5768; font-size: 11.5px; padding: 18px 0 6px; }

  /* club cards grid */
  .club-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 620px) { .club-grid { grid-template-columns: 1fr; } }
  .club-card { cursor: pointer; transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
  .club-card:hover { transform: translateY(-3px); border-color: #3d5271; box-shadow: 0 10px 24px rgba(0,0,0,.35); }
  .club-card h3 { margin-bottom: 6px; }
  .club-swatch { display:inline-block; width:14px; height:14px; border-radius:50%; margin-right:6px; vertical-align:middle; border:1px solid rgba(255,255,255,.25); }
</style>
</head>

/* ============================== HELPERS GERAIS ============================ */
function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }
function rand(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function chance(pct){ return Math.random()*100 < pct; }
function fmtData(d){ const dd=String(d.getDate()).padStart(2,'0'), mm=String(d.getMonth()+1).padStart(2,'0'); return `${dd}/${mm}/${d.getFullYear()}`; }
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* Barra de progresso textual (0-100) usada em várias telas do painel */
function barraHtml(label, valor, tipo){
  valor = clamp(Math.round(valor),0,100);
  let cls = tipo || (valor>=66?'':valor>=33?'warn':'danger');
  if(!tipo){ cls = valor>=66?'':valor>=33?'warn':'danger'; }
  return `<div><div class="bar-label"><span>${escapeHtml(label)}</span><span>${valor}</span></div>
  <div class="bar-track"><div class="bar-fill ${cls}" style="width:${valor}%"></div></div></div>`;
}

/* Gera os atributos iniciais (35-65) somando os modificadores do estilo escolhido */
function gerarAtributosIniciais(estiloKey){
  const mods = ESTILOS[estiloKey].mods;
  const tudo = {};
  const grupos = [...ATRIBUTOS_DEF.tecnicos, ...ATRIBUTOS_DEF.fisicos, ...ATRIBUTOS_DEF.mentais];
  grupos.forEach(([chave]) => {
    const base = rand(35,65);
    const mod = mods[chave] || 0;
    tudo[chave] = clamp(base + mod, 25, 85);
  });
  return tudo;
}

/* Calcula ano de nascimento para que o personagem tenha exatamente 16 anos hoje */
function calcularNascimento(dia, mes){
  const hoje = new Date();
  let ano = hoje.getFullYear() - 16;
  const candidato = new Date(ano, mes-1, dia);
  if(candidato > hoje) ano -= 1; // se aniversário ainda não ocorreu esse ano, nasceu um ano antes
  return new Date(ano, mes-1, dia);
}

/* Cria um novo jogador + estado completo de carreira a partir dos dados do formulário */

/* ============================== PERSISTÊNCIA (localStorage) ================ */
function salvarJogo(){
  if(!GAME) return;
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(GAME)); }
  catch(e){ console.warn('Falha ao salvar:', e); }
}
function carregarJogo(){
  const raw = localStorage.getItem(SAVE_KEY);
  if(!raw) return false;
  try{ GAME = JSON.parse(raw); return true; }
  catch(e){ return false; }
}
function existeSave(){ return !!localStorage.getItem(SAVE_KEY); }
function apagarSave(){ localStorage.removeItem(SAVE_KEY); GAME = null; }

/* Idade atual calculada a partir da data de nascimento salva */
function idadeAtual(){
  const nasc = new Date(GAME.identidade.nascimento);
  const hoje = new Date();
  let idade = hoje.getFullYear() - nasc.getFullYear();
  const m = hoje.getMonth() - nasc.getMonth();
  if(m < 0 || (m===0 && hoje.getDate() < nasc.getDate())) idade--;
  return idade;
}

/* Empurra uma notícia para o feed (tipo: torcida|midia|familia|treinador|geral) */
function pushNoticia(tipo, texto){
  GAME.noticias.unshift({tipo, texto, semana: GAME.status.semanaGlobal});
  if(GAME.noticias.length > 60) GAME.noticias.pop();
}
function pushHistorico(texto){
  GAME.historico.unshift({texto, semana: GAME.status.semanaGlobal});
}

  (g)=>`Alguém do departamento de marketing de uma marca esportiva começou a seguir seu perfil.`

function atualizarRedesSociais(deltaSeguidores, categoria){
  if(!GAME.social) GAME.social = { seguidores: rand(120,400), mensagens: [] };
  GAME.social.seguidores = Math.max(0, Math.round(GAME.social.seguidores + deltaSeguidores));
  let pool;
  if(categoria === 'elogio') pool = MENSAGENS_FA_ELOGIO;
  else if(categoria === 'critica') pool = MENSAGENS_FA_CRITICA;
  else if(categoria === 'familia') pool = MENSAGENS_FAMILIA_SOCIAL;
  else if(categoria === 'marca') pool = MENSAGENS_MARCA_TEASER;
  else return;
  const texto = pick(pool)(GAME);
  GAME.social.mensagens.unshift({ texto, semana: GAME.status.semanaGlobal, categoria });
  if(GAME.social.mensagens.length > 30) GAME.social.mensagens.pop();
}
function concluirObjetivo(id){
  const o = GAME.objetivos.find(o=>o.id===id);

const app = document.getElementById('app');

// Aplica o tema visual (fundo/acentos) com as cores do clube escolhido
function aplicarTemaClube(clube){
  document.documentElement.style.setProperty('--club-c1', clube.cor1);
  document.documentElement.style.setProperty('--club-c2', clube.cor2);
  document.body.classList.add('tema-clube');

function removerTemaClube(){ document.body.classList.remove('tema-clube'); }
function sincronizarTemaClube(){
  if(GAME && GAME.clube) aplicarTemaClube(GAME.clube); else removerTemaClube();
}

// Dispara uma transição suave sempre que o conteúdo principal muda de tela
const appObserver = new MutationObserver(() => {
  app.classList.remove('fade-in');
  void app.offsetWidth; // força reflow para reiniciar a animação
  app.classList.add('fade-in');
});
appObserver.observe(app, { childList: true });

function render(){
  sincronizarTemaClube();
  if(!GAME){ return renderStart(); }
  if(GAME.fase === 'historia') return renderHistoriaPassado();
  if(GAME.fase === 'clubes') return renderSelecaoClubes();
  if(GAME.fase === 'peneira') return renderPeneira();
  if(GAME.fase === 'temporada') return renderTemporada();
  if(GAME.fase === 'entressafra') return renderEntressafra();
  if(GAME.fase === 'fim') return renderFimDeTemporada();
  renderStart();
}

/* ============================ SELEÇÃO DE CLUBE ==============================
   Seleciona 4 clubes reais próximos do local de nascimento: primeiro tenta
   clubes do mesmo estado; se não houver 4, completa com clubes da mesma
   região. Estrutura pronta para, no futuro, ser trocada por uma busca via
   API de geolocalização real.
   ========================================================================= */
function selecionarClubesProximos(uf){
  const regiao = REGIOES[uf];
  const mesmoEstado = CLUBES.filter(c => c.uf === uf);
  const mesmaRegiao = CLUBES.filter(c => c.uf !== uf && REGIOES[c.uf] === regiao);
  const combinados = [...mesmoEstado, ...mesmaRegiao];
  // embaralha levemente mantendo prioridade de proximidade
  const top = combinados.slice(0, 8);
  const escolhidos = [];
  while(escolhidos.length < 4 && top.length){
    const idx = rand(0, top.length-1);
    escolhidos.push(top.splice(idx,1)[0]);
  }
  // caso a base não tenha 4 nem na região (raro), completa com clubes aleatórios
  while(escolhidos.length < 4){
    const extra = pick(CLUBES);
    if(!escolhidos.find(c=>c.id===extra.id)) escolhidos.push(extra);
  }
  return escolhidos;
}

function renderSelecaoClubes(){
  if(!GAME.clubesOferecidos || GAME.clubesOferecidos.length === 0){
    GAME.clubesOferecidos = selecionarClubesProximos(GAME.identidade.uf).map(c=>c.id);
    salvarJogo();

  const clubes = GAME.clubesOferecidos.map(id => CLUBES.find(c=>c.id===id));

/* ================================= PENEIRA ==================================
   6 fases narrativas com escolhas. Cada escolha altera variáveis (energia,
   moral, confiança, pressão, relação com elenco, "chance de destaque").
   Ao final, o resultado é calculado a partir dos atributos, do acumulado
   da peneira e da exigência do clube escolhido.
   ========================================================================= */

// Gera o pequeno círculo de companheiros persistentes da temporada (amizade
// individual, 0-100, que evolui com eventos específicos ao longo do ano)
const PAPEIS_ELENCO = ['Parceiro inseparável no CT', 'Rival direto pela vaga', 'Veterano do elenco', 'Zoeiro do grupo', 'Mais reservado, mas leal'];
function gerarElenco(){
  const embaralhados = [...NOMES_COMPANHEIROS].sort(() => Math.random()-0.5);
  return embaralhados.slice(0,5).map((nome,i) => ({ id:'comp_'+i, nome, papel: PAPEIS_ELENCO[i % PAPEIS_ELENCO.length], relacao:50 }));
}

function iniciarPeneira(clube){
  GAME.clube = { id:clube.id, nome:clube.nome, cidade:clube.cidade, uf:clube.uf,
    divisao:clube.divisao, estiloJogo:clube.estiloJogo, nivelBase:clube.nivelBase,
    chanceAprovacaoBase:clube.chanceAprovacaoBase, pressaoTorcida:clube.pressaoTorcida,
    oportunidadeJovens:clube.oportunidadeJovens, financeiro:clube.financeiro,
    reputacao:clube.reputacao, exigenciaPeneira:clube.exigenciaPeneira,
    cor1:clube.cor1, cor2:clube.cor2 };
  GAME.tecnico = pick(NOMES_TECNICOS);
  GAME.observador = pick(NOMES_OBSERVADORES);
  GAME.peneiraState = { faseIndex:0, chanceDestaque:0 };
  GAME.fase = 'peneira';
  pushNoticia('geral', `Você foi tentar a peneira do ${clube.nome}.`);
  salvarJogo();
  render();
}

function aplicarEfeitos(efeitos){
  if(!efeitos) return;
  const s = GAME.status, so = GAME.sociais, r = GAME.relacoes;
  if(efeitos.energia) s.energia = clamp(s.energia + efeitos.energia, 0, 100);
  if(efeitos.moral) so.moral = clamp(so.moral + efeitos.moral, 0, 100);
  if(efeitos.confianca) so.confianca = clamp(so.confianca + efeitos.confianca, 0, 100);
  if(efeitos.pressao) s.pressao = clamp(s.pressao + efeitos.pressao, 0, 100);
  if(efeitos.pressaoPsicologica) so.pressaoPsicologica = clamp(so.pressaoPsicologica + efeitos.pressaoPsicologica, 0, 100);
  if(efeitos.relacaoElenco) r.elenco = clamp(r.elenco + efeitos.relacaoElenco, 0, 100);
  if(efeitos.relacaoTreinador) r.treinador = clamp(r.treinador + efeitos.relacaoTreinador, 0, 100);
  if(efeitos.relacaoFamilia) r.familia = clamp(r.familia + efeitos.relacaoFamilia, 0, 100);
  if(efeitos.relacaoTorcida) r.torcida = clamp(r.torcida + efeitos.relacaoTorcida, 0, 100);
  if(efeitos.relacaoMidia) r.midia = clamp(r.midia + efeitos.relacaoMidia, 0, 100);
  if(efeitos.relacaoDiretoria) r.diretoria = clamp(r.diretoria + efeitos.relacaoDiretoria, 0, 100);
  if(efeitos.reputacaoLocal) so.reputacaoLocal = clamp(so.reputacaoLocal + efeitos.reputacaoLocal, 0, 100);
  if(efeitos.popularidade) so.popularidade = clamp(so.popularidade + efeitos.popularidade, 0, 100);
  if(efeitos.imagemMidia) so.imagemMidia = clamp(so.imagemMidia + efeitos.imagemMidia, 0, 100);
  if(efeitos.disciplina) GAME.atributos.disciplina = clamp(GAME.atributos.disciplina + efeitos.disciplina, 1, 99);
  if(efeitos.chanceDestaque && GAME.peneiraState) GAME.peneiraState.chanceDestaque = clamp(GAME.peneiraState.chanceDestaque + efeitos.chanceDestaque, 0, 100);
  if(efeitos.atributos){
    Object.keys(efeitos.atributos).forEach(k => {
      GAME.atributos[k] = clamp((GAME.atributos[k]||40) + efeitos.atributos[k], 1, 99);
    });
  }
  if(efeitos.tracos){
    Object.keys(efeitos.tracos).forEach(k => {
      GAME.tracos[k] = clamp((GAME.tracos[k]||0) + efeitos.tracos[k], 0, 999);
    });
  }
  if(efeitos.amigo && GAME.elenco){
    const alvo = GAME.elenco.find(a => a.id === efeitos.amigo);
    if(alvo) alvo.relacao = clamp(alvo.relacao + (efeitos.amigoDelta||0), 0, 100);
  }
  if(efeitos.saudeMental) ajustarSaudeMental(efeitos.saudeMental);
  if(efeitos.carteira) GAME.carteira = Math.max(0, Math.round((GAME.carteira||0) + efeitos.carteira));
}

/* ============================== SAÚDE MENTAL ================================
   Reflete o estado psicológico do jogador: cai com maus resultados, pressão
   alta, lesões e eventos pesados fora de campo; sobe com bom desempenho,
   apoio da família/amigos e descanso. Valores muito baixos têm consequências
   narrativas (e podem influenciar o desfecho da temporada).
   ========================================================================= */
function ajustarSaudeMental(delta){
  GAME.status.saudeMental = clamp(GAME.status.saudeMental + delta, 0, 100);
}
function statusSaudeMentalLabel(){
  const v = GAME.status.saudeMental;
  if(v >= 75) return 'Estável e confiante';
  if(v >= 55) return 'Equilibrado, com altos e baixos';
  if(v >= 35) return 'Sobrecarregado';
  if(v >= 20) return 'Em sofrimento';
  return 'Em crise — precisa de ajuda';
}

/* ============================== TRAÇOS DE PERSONALIDADE =====================
   Cada escolha pode empurrar levemente o personagem para um traço dominante.
   Não é um "certo ou errado" — só deixa alguns diálogos futuros reagirem ao
   jeito que o jogador vem construindo o personagem.
   ========================================================================= */
const TRACOS_LABELS = {
  humilde: 'Humilde', confiante: 'Confiante', descontraido: 'Descontraído',
  serio: 'Sério e focado', rebelde: 'Cabeça-quente'
};
function tracoDominante(){
  const entradas = Object.entries(GAME.tracos);
  const max = Math.max(...entradas.map(([,v]) => v));
  if(max <= 0) return null;
  const empatados = entradas.filter(([,v]) => v === max).map(([k]) => k);
  return empatados[0];
}
function labelTracoDominante(){
  const t = tracoDominante();
  return t ? TRACOS_LABELS[t] : 'Ainda em formação';
}

const NOMES_FASES_PENEIRA = ['Chegada', 'Avaliação Física', 'Treino Técnico', 'Coletivo', 'Conversa com Observador'];

function renderPeneira(){
  const ps = GAME.peneiraState;
  if(ps.faseIndex >= FASES_PENEIRA.length){ return renderResultadoPeneira(); }
  if(ps.seguimentoAtual) return renderSeguimentoPeneira();
  const fase = FASES_PENEIRA[ps.faseIndex];
  const texto = typeof fase.texto === 'function' ? fase.texto(GAME) : pick(fase.texto).replace('{OBS}', GAME.observador).replace('{TEC}', GAME.tecnico).replace('{CLUBE}', GAME.clube.nome);
  app.innerHTML = `
    <div id="status-bar">
      <div class="sb-item"><span class="lbl">Clube</span><b>${GAME.clube.nome}</b></div>
      <div class="sb-item"><span class="lbl">Fase</span><b>${ps.faseIndex+1}/6 — ${NOMES_FASES_PENEIRA[ps.faseIndex]}</b></div>
      <div class="sb-item"><span class="lbl">Energia</span><b>${GAME.status.energia}</b></div>
      <div class="sb-item"><span class="lbl">Confiança</span><b>${GAME.sociais.confianca}</b></div>
    </div>
    <div class="card">
      <div id="scene-text">${escapeHtml(texto).replace(/\n/g,'<br>')}</div>
      <div class="choices">
        ${fase.escolhas.map((esc,i) => `<button class="btn" data-i="${i}">${escapeHtml(esc.label)}</button>`).join('')}
      </div>
    </div>
  `;
  document.querySelectorAll('.choices .btn').forEach(btn => {
    btn.onclick = () => {
      const esc = fase.escolhas[parseInt(btn.dataset.i,10)];
      pushHistorico(`Peneira (${NOMES_FASES_PENEIRA[ps.faseIndex]}): ${esc.label}`);
      if(esc.seguimento){
        ps.seguimentoAtual = { baseEfeitos: esc.efeitos, seguimento: esc.seguimento };
        salvarJogo();
        render();
        return;
      }
      aplicarEfeitos(esc.efeitos);
      ps.faseIndex += 1;
      salvarJogo();
      render();
    };
  });
}

// Renderiza a segunda (ou terceira) réplica de uma conversa prolongada da peneira
function renderSeguimentoPeneira(){
  const ps = GAME.peneiraState;
  const { seguimento } = ps.seguimentoAtual;
  const texto = typeof seguimento.texto === 'function' ? seguimento.texto(GAME) : seguimento.texto;
  app.innerHTML = `
    <div id="status-bar">
      <div class="sb-item"><span class="lbl">Clube</span><b>${GAME.clube.nome}</b></div>
      <div class="sb-item"><span class="lbl">Fase</span><b>${ps.faseIndex+1}/6 — ${NOMES_FASES_PENEIRA[ps.faseIndex]}</b></div>
      <div class="sb-item"><span class="lbl">Energia</span><b>${GAME.status.energia}</b></div>
      <div class="sb-item"><span class="lbl">Confiança</span><b>${GAME.sociais.confianca}</b></div>
    </div>
    <div class="card">
      <div id="scene-text">${escapeHtml(texto).replace(/\n/g,'<br>')}</div>
      <div class="choices">
        ${seguimento.escolhas.map((esc,i) => `<button class="btn" data-i="${i}">${escapeHtml(esc.label)}</button>`).join('')}
      </div>
    </div>
  `;
  document.querySelectorAll('.choices .btn').forEach(btn => {
    btn.onclick = () => {
      const esc = seguimento.escolhas[parseInt(btn.dataset.i,10)];
      aplicarEfeitos(ps.seguimentoAtual.baseEfeitos);
      aplicarEfeitos(esc.efeitos);
      pushHistorico(`Peneira (${NOMES_FASES_PENEIRA[ps.faseIndex]}, continuação): ${esc.label}`);
      ps.seguimentoAtual = null;
      ps.faseIndex += 1;
      salvarJogo();
      render();
    };
  });
}

  'Lateral-direito': ['velocidade','resistencia','cruzamento','marcacao','desarme','agilidade'],

  'Zagueiro': ['marcacao','desarme','interceptacao','cabeceio','forca','concentracao'],
  'Volante': ['desarme','interceptacao','passeCurto','resistencia','disciplina','marcacao'],
  'Meio-campista': ['passeCurto','passeLongo','visaoDeJogo','controleDeBola','resistencia','drible'],
  'Meia ofensivo': ['visaoDeJogo','drible','passeCurto','finalizacao','controleDeBola','frieza'],
  'Ponta-direita': ['velocidade','drible','cruzamento','finalizacao','aceleracao','controleDeBola'],

  'Centroavante': ['finalizacao','cabeceio','forca','frieza','decisao','impulsao']
};

function mediaAtributosChave(){
  const chaves = ATRIBUTOS_POR_POSICAO[GAME.identidade.posicaoPrincipal] || ATRIBUTOS_POR_POSICAO['Meio-campista'];
  const soma = chaves.reduce((acc,k) => acc + (GAME.atributos[k]||40), 0);
  return soma / chaves.length;
}

function renderResultadoPeneira(){
  const ps = GAME.peneiraState;
  const mediaChave = mediaAtributosChave();
  const score = mediaChave*0.5 + ps.chanceDestaque*0.25 + GAME.sociais.confianca*0.15
    + GAME.relacoes.treinador*0.10 - GAME.sociais.pressaoPsicologica*0.10 + rand(-8,8);
  const exigencia = GAME.clube.exigenciaPeneira;
  const probabilidade = clamp(GAME.clube.chanceAprovacaoBase + (score - exigencia)*1.3, 5, 95);
  const aprovado = chance(probabilidade);

  let texto, escolhas;
  if(aprovado){
    // define tipo de contrato conforme o quão acima da exigência ficou
    const margem = score - exigencia;
    let contrato;
    if(margem > 15) contrato = { tipo:'Contrato de base', bolsa:rand(600,1200), duracao:12, expectativa:'Alta', confiancaDiretoria:70 };
    else if(margem > 0) contrato = { tipo:'Bolsa auxílio', bolsa:rand(300,600), duracao:8, expectativa:'Moderada', confiancaDiretoria:55 };
    else contrato = { tipo:'Promessa de avaliação futura', bolsa:0, duracao:4, expectativa:'Baixa', confiancaDiretoria:40 };
    GAME.contrato = contrato;
    GAME.status.statusElenco = 'Elenco de base';
    GAME.relacoes.diretoria = clamp(GAME.relacoes.diretoria + 10, 0, 100);
    GAME.elenco = gerarElenco();
    concluirObjetivo('aprovadoPeneira');
    if(contrato.tipo !== 'Promessa de avaliação futura') concluirObjetivo('contratoBase');
    texto = `${GAME.observador} chama seu nome no fim do dia.\n\n— Parabéns, moleque. Você ficou. ${GAME.clube.nome} vai te dar uma chance.\n\nSeu ${contrato.tipo.toLowerCase()} foi confirmado. Sua família comemora quando você liga contando a notícia.`;
    pushNoticia('midia', `${GAME.identidade.apelido} é aprovado na peneira do ${GAME.clube.nome} e assina ${contrato.tipo.toLowerCase()}.`);
    pushNoticia('familia', 'Sua família comemora a aprovação com um jantar especial.');
    escolhas = [{ label:'Começar a temporada', acao: iniciarTemporada }];
  } else {
    texto = `${GAME.observador} evita seu olhar quando lê a lista.\n\n— Obrigado por vir. Não vai dar dessa vez.\n\nO caminho de volta para casa é silencioso. Ainda existem outros clubes, outras chances.`;
    GAME.sociais.moral = clamp(GAME.sociais.moral - 15, 0, 100);
    GAME.sociais.confianca = clamp(GAME.sociais.confianca - 10, 0, 100);
    pushNoticia('geral', `${GAME.identidade.apelido} não foi aprovado na peneira do ${GAME.clube.nome}.`);
    const outrosDisponiveis = GAME.clubesOferecidos.filter(id => id !== GAME.clube.id).length > 0;
    escolhas = [];
    if(outrosDisponiveis) escolhas.push({ label:'Tentar a sorte em outro clube', acao: () => { GAME.clubesOferecidos = GAME.clubesOferecidos.filter(id=>id!==GAME.clube.id); GAME.clube=null; GAME.peneiraState=null; GAME.fase='clubes'; salvarJogo(); render(); } });
    escolhas.push({ label:'Encerrar por aqui (ver final)', acao: () => { GAME.fase='fim'; GAME.finalTipo='reprovado'; salvarJogo(); render(); } });
  }

  app.innerHTML = `
    <div class="card">
      <h2>Resultado da Peneira</h2>
      <div id="scene-text">${escapeHtml(texto).replace(/\n/g,'<br>')}</div>
      <div class="choices">
        ${escolhas.map((e,i)=>`<button class="btn ${aprovado?'btn-primary':''}" data-i="${i}">${escapeHtml(e.label)}</button>`).join('')}
      </div>
    </div>
  `;
  document.querySelectorAll('.choices .btn').forEach(btn => {
    btn.onclick = () => escolhas[parseInt(btn.dataset.i,10)].acao();
  });
  salvarJogo();
}

/* ================================ TEMPORADA ==================================
   Dividida em 5 períodos, cada um com N semanas. Cada semana pode conter,
   nessa ordem: evento aleatório (opcional) -> treino -> partida (se agendada
   no calendário do período) -> avança para a próxima semana.
   ========================================================================= */
const PERIODOS = [
  { nome:'Pré-temporada', semanas:4, jogos:[false,false,true,true] },
  { nome:'Início do Estadual/Sub-20', semanas:5, jogos:[true,false,true,false,true] },
  { nome:'Meio da Temporada', semanas:5, jogos:[true,false,true,false,true] },
  { nome:'Returno / Reta Final do Estadual', semanas:5, jogos:[true,true,false,true,false] },
  { nome:'Fase Decisiva', semanas:5, jogos:[true,true,false,true,true] },
  { nome:'Encerramento', semanas:3, jogos:[true,false,false] }
];

const TREINOS = [
  { id:'finalizacao', nome:'Finalização', attrs:['finalizacao','chuteDeLonge'], custo:15, riscoLesaoMod:2 },
  { id:'passeVisao', nome:'Passe e Visão', attrs:['passeCurto','passeLongo','visaoDeJogo'], custo:12, riscoLesaoMod:0 },
  { id:'dribleConducao', nome:'Drible e Condução', attrs:['drible','controleDeBola'], custo:14, riscoLesaoMod:2 },
  { id:'fisico', nome:'Físico e Resistência', attrs:['resistencia','forca','velocidade'], custo:22, riscoLesaoMod:8 },
  { id:'defesaPosicionamento', nome:'Defesa e Posicionamento', attrs:['desarme','marcacao','interceptacao'], custo:14, riscoLesaoMod:1 },
  { id:'bolaParada', nome:'Bola Parada', attrs:['bolaParada','cabeceio'], custo:10, riscoLesaoMod:0 },
  { id:'mentalidade', nome:'Mentalidade e Concentração', attrs:['concentracao','frieza','controleEmocional'], custo:8, riscoLesaoMod:-2 },
  { id:'descanso', nome:'Descanso e Recuperação', attrs:[], custo:-30, riscoLesaoMod:-10 }
];

function iniciarTemporada(){
  GAME.fase = 'temporada';
  GAME.atributosIniciaisSnapshot = { ...GAME.atributos };
  GAME.temporadaState = {
    periodoIndex:0, semanaNoPeriodo:0, subFase:'treino',
    eventoAtual:null, jogoAtual:null, mediaTreinoRecente:50, empresarioOfertado:false, seguimentoEvento:null,
    eventosObscurosOcorridos:0, lutoOcorrido:false
  };
  pushNoticia('geral', `Pré-temporada iniciada no ${GAME.clube.nome}.`);
  decidirInicioDeSemana();
  salvarJogo();
  render();
}

function periodoAtualObj(){ return PERIODOS[GAME.temporadaState.periodoIndex]; }

// Decide, no início de uma semana nova, se haverá evento aleatório antes do treino
function decidirInicioDeSemana(){
  const ts = GAME.temporadaState;
  if(GAME.lesaoAtual){ ts.subFase = 'lesao'; return; }
  if(chance(45)){
    ts.eventoAtual = sortearEvento();
    ts.subFase = 'evento';
  } else {
    ts.subFase = 'treino';
  }
}

function avancarSemana(){
  const ts = GAME.temporadaState;
  ts.semanaNoPeriodo += 1;
  const periodo = periodoAtualObj();
  if(ts.semanaNoPeriodo >= periodo.semanas){
    ts.periodoIndex += 1;
    ts.semanaNoPeriodo = 0;
    if(ts.periodoIndex >= PERIODOS.length){
      finalizarTemporada();
      return;
    } else {
      pushNoticia('geral', `Início do período: ${periodoAtualObj().nome}.`);
    }
  }
  GAME.status.semanaGlobal += 1;
  // recuperação natural leve de energia entre semanas
  GAME.status.energia = clamp(GAME.status.energia + 6, 0, 100);
  // bolsa/salário e eventual patrocínio caem na conta toda semana (valor mensal / 4),
  // descontada a comissão do empresário, se houver
  const ganhoSemanal = (GAME.contrato.bolsa||0)/4 + (GAME.patrocinioAtual ? GAME.patrocinioAtual.valorMensal/4 : 0);
  const comissao = GAME.empresarioAtual ? (GAME.empresarioComissao||10)/100 : 0;
  GAME.carteira = Math.round((GAME.carteira||0) + ganhoSemanal * (1 - comissao));
  aplicarReputacaoEmpresario();
  decidirInicioDeSemana();
  salvarJogo();
  render();
}

// Efeitos periódicos e discretos do tipo de empresário na carreira — o vínculo
// não é só narrativo uma vez, ele pesa (bem ou mal) semana após semana.
function aplicarReputacaoEmpresario(){
  if(!GAME.empresarioAtual) return;
  if(GAME.empresarioAtual === 'experiente' && chance(12)){
    GAME.relacoes.diretoria = clamp(GAME.relacoes.diretoria+2, 0, 100);
  } else if(GAME.empresarioAtual === 'amigoFamilia' && chance(10)){
    GAME.relacoes.familia = clamp(GAME.relacoes.familia+2, 0, 100);
  } else if(GAME.empresarioAtual === 'oportunista' && chance(9)){
    GAME.relacoes.diretoria = clamp(GAME.relacoes.diretoria-4, 0, 100);
    pushNoticia('geral', 'Seu empresário entrou em atrito com a diretoria por causa de exigências fora da curva.');
  } else if(GAME.empresarioAtual === 'desconhecido' && chance(7)){
    GAME.sociais.pressaoPsicologica = clamp(GAME.sociais.pressaoPsicologica+6, 0, 100);
    pushNoticia('geral', 'Você tenta falar com seu empresário há dias e só cai na caixa postal.');
  }
}

function sortearEvento(){
  const ts = GAME.temporadaState;
  const pool = [...EVENTOS_RECORRENTES, ...EVENTOS_ADOLESCENTE, ...EVENTOS_EQUIPE, ...EVENTOS_CLUBE];
  if(GAME.elenco && GAME.elenco.length){
    pool.push(...EVENTOS_AMIZADE.map(gerador => gerador()));
  }
  if(!GAME.empresarioAtual && !ts.empresarioOfertado && ts.periodoIndex >= 1 && chance(40)){
    pool.push(gerarEventoEmpresario());
  }
  if(!GAME.patrocinioAtual && GAME.stats.notaMedia > 0 && chance(28)){
    const elegiveis = MARCAS_ESPORTIVAS.filter(m => GAME.stats.interesseClubes >= m.requisitoInteresse && GAME.stats.notaMedia >= m.requisitoNota);
    if(elegiveis.length) pool.push(gerarEventoPatrocinio(elegiveis[elegiveis.length-1]));
  }
  // Lado obscuro do futebol: raro, no máximo 2 vezes por temporada
  if(ts.eventosObscurosOcorridos < 2 && ts.periodoIndex >= 1 && chance(8)){
    pool.push(pick(EVENTOS_LADO_OBSCURO));
  }
  // Luto: no máximo 1 vez por temporada, chance bem baixa
  if(!ts.lutoOcorrido && ts.periodoIndex >= 1 && chance(4)){
    pool.push(pick(EVENTOS_LUTO));
  }
  // Evita repetir os últimos eventos vistos (inclusive de temporadas anteriores)
  const recentes = GAME.eventosRecentesIds || [];
  const poolFiltrado = pool.filter(e => !recentes.includes(e.id));
  const escolhido = pick(poolFiltrado.length ? poolFiltrado : pool);
  GAME.eventosRecentesIds = [escolhido.id, ...recentes].slice(0, 12);
  return escolhido;
}

// Risco de lesão: só pesa de verdade quando a energia já está baixa (fadiga
// acumulada). Com energia em dia, o risco fica perto do mínimo — lesão deve
// ser exceção ao longo da temporada, não regra.
function checarLesao(riscoMod){
  if(GAME.lesaoAtual) return;
  const fadiga = Math.max(0, 55 - GAME.status.energia); // 0 se energia >= 55
  const prob = clamp(fadiga*0.22 + riscoMod*0.6 + (100-GAME.atributos.resistencia)*0.05 - GAME.atributos.forca*0.03 + rand(-4,4), 0, 16);
  if(chance(prob)){
    let tipo, semanas;
    const grau = rand(1,100);
    if(grau <= 60){ tipo='Desconforto muscular'; semanas=1; }
    else if(grau <= 87){ tipo='Entorse leve'; semanas=2; }
    else if(grau <= 97){ tipo='Lesão média'; semanas=rand(3,4); }
    else { tipo='Lesão grave'; semanas=rand(6,8); }
    GAME.lesaoAtual = { tipo, semanasRestantes:semanas };
    GAME.stats.lesoes += 1;
    GAME.sociais.moral = clamp(GAME.sociais.moral - 10, 0, 100);
    GAME.status.pressao = clamp(GAME.status.pressao + 8, 0, 100);
    ajustarSaudeMental(-8);
    pushNoticia('geral', `${GAME.identidade.apelido} sofreu uma lesão: ${tipo}.`);
  }
}

function renderLesao(){
  const texto = `Você está lidando com: ${GAME.lesaoAtual.tipo}.\nO departamento médico estima ${GAME.lesaoAtual.semanasRestantes} semana(s) de recuperação. Por enquanto, treinos e jogos ficam de lado.`;
  app.innerHTML = `
    ${statusBarHtml()}
    <div class="card">
      <div class="card-title">Recuperação</div>
      <div id="scene-text">${escapeHtml(texto).replace(/\n/g,'<br>')}</div>
      <div class="choices"><button class="btn btn-primary" id="btn-continuar-lesao">Seguir para a próxima semana</button></div>
    </div>
  `;
  document.getElementById('btn-continuar-lesao').onclick = () => {
    GAME.lesaoAtual.semanasRestantes -= 1;
    GAME.status.condicaoFisica = clamp(GAME.status.condicaoFisica + 8, 0, 100);
    if(GAME.lesaoAtual.semanasRestantes <= 0){
      pushNoticia('geral', `${GAME.identidade.apelido} está recuperado e liberado para retornar.`);
      GAME.lesaoAtual = null;
    }
    avancarSemana();
  };
}

      </div>
    </div>
  `;
  document.querySelectorAll('.choices .btn').forEach(btn => {
    btn.onclick = () => aplicarTreino(TREINOS[parseInt(btn.dataset.i,10)]);
  });

function attrNome(chave){
  const todos = [...ATRIBUTOS_DEF.tecnicos, ...ATRIBUTOS_DEF.fisicos, ...ATRIBUTOS_DEF.mentais];
  const found = todos.find(([k])=>k===chave);
  return found ? found[1] : chave;
}

function aplicarTreino(treino){
  const ts = GAME.temporadaState;
  const fatorDisciplina = 0.5 + (GAME.atributos.disciplina/100)*0.5;
  const fatorEnergia = GAME.status.energia >= 30 ? 1 : 0.5;
  const fatorMoral = 0.7 + (GAME.sociais.moral/100)*0.3;
  let qualidade = 0;
  treino.attrs.forEach(chave => {
    const atual = GAME.atributos[chave];
    // retornos decrescentes: fica cada vez mais difícil evoluir perto do topo,
    // pra ninguém virar craque de atributo 99 em uma ou duas temporadas
    const fatorTeto = clamp(1 - (atual-30)/95, 0.12, 1);
    const ganho = atual >= 97 ? 0 : Math.max(1, Math.round(rand(1,2) * fatorDisciplina * fatorEnergia * fatorMoral * fatorTeto));
    GAME.atributos[chave] = clamp(GAME.atributos[chave] + ganho, 1, 99);
    qualidade += ganho;
  });
  GAME.status.energia = clamp(GAME.status.energia - treino.custo, 0, 100);
  ts.mediaTreinoRecente = clamp(ts.mediaTreinoRecente*0.6 + (treino.id==='descanso'? 55 : (40+qualidade*8))*0.4, 0, 100);
  pushHistorico(`Treino da semana: ${treino.nome}.`);
  checarLesao(treino.riscoLesaoMod);
  // objetivo: evoluir 5 pontos em algum atributo desde o início da temporada
  const evoluiu5 = Object.keys(GAME.atributos).some(k => GAME.atributos[k] - (GAME.atributosIniciaisSnapshot[k]||GAME.atributos[k]) >= 5);
  if(evoluiu5) concluirObjetivo('evoluir5');
  salvarJogo();
  prosseguirAposTreino();
}

function prosseguirAposTreino(){
  const ts = GAME.temporadaState;
  if(GAME.lesaoAtual){ ts.subFase='lesao'; render(); return; }
  const periodo = periodoAtualObj();
  const temJogo = periodo.jogos[ts.semanaNoPeriodo];
  if(temJogo){
    ts.subFase = 'preJogo';
  } else {
    avancarSemana();
    return;
  }
  render();
}

/* ------------------------------ PARTIDA --------------------------------- */
function decidirEscalacao(){
  const ts = GAME.temporadaState;
  const score = GAME.relacoes.treinador*0.3 + ts.mediaTreinoRecente*0.3 + GAME.status.energia*0.2 + GAME.atributos.disciplina*0.2 + rand(-15,15);
  if(score >= 65) return 'titular';
  if(score >= 38) return 'reserva';
  return 'naoRelacionado';
}

// Calcula o "nível" da decisão (ótimo/bom/neutro/ruim/péssimo) a partir do
// atributo relevante, da dificuldade do adversário e de um tanto de sorte
function resolverNivelLance(attr, dificuldade){
  const valor = GAME.atributos[attr] || 45;
  const score = valor - dificuldade*0.45 + rand(-22,22);
  if(score >= 42) return 'otimo';
  if(score >= 18) return 'bom';
  if(score >= -8) return 'neutro';
  if(score >= -28) return 'ruim';
  return 'pessimo';
}

function prepararPartida(){
  const status = decidirEscalacao();
  const adversario = `${pick(['Atlético','União','Esporte Clube','Operário','Grêmio','Ferroviário'])} ${pick(['Regional','da Serra','Novo Horizonte','Popular','do Vale'])}`;
  let minutos = 0, entrouBanco=false, titular=false;
  if(status === 'titular'){ titular = true; minutos = clamp(rand(65,90) - Math.round((100-GAME.status.condicaoFisica)/10), 20, 90); }
  else if(status === 'reserva'){
    const entraChance = clamp(30 + (GAME.clube.oportunidadeJovens-50)*0.4 + rand(-10,10), 5, 90);
    if(chance(entraChance)){ entrouBanco = true; minutos = rand(10,30); }
  }
  const posicao = GAME.identidade.posicaoPrincipal;
  const ehGoleiro = posicao === 'Goleiro';
  const ehAtacante = ['Ponta-direita','Ponta-esquerda','Segundo atacante','Centroavante','Meia ofensivo'].includes(posicao);
  const ehDefensor = ['Zagueiro','Lateral-direito','Lateral-esquerdo','Volante'].includes(posicao);
  const dificuldade = clamp(GAME.clube.reputacao*0.6 + rand(-10,15), 15, 95);

  const numLances = titular ? 2 : (entrouBanco ? 1 : 0);
  const pool = ehGoleiro ? LANCES_GOLEIRO : ehDefensor ? LANCES_DEFESA : LANCES_ATAQUE;
  const lances = [];
  for(let i=0;i<numLances;i++) lances.push(pick(pool));

  GAME.temporadaState.partidaEmAndamento = {
    status, adversario, minutos, entrouBanco, titular, dificuldade,
    ehGoleiro, ehAtacante, ehDefensor,
    lances, indiceLance:0,
    acumulado: { gols:0, assist:0, erros:0, amarelo:0, vermelho:0, defesaImportante:0, eventos:[] }
  };
  if(lances.length === 0){
    finalizarPartida(); // já salva e renderiza
  } else {
    GAME.temporadaState.subFase = 'lance';
    salvarJogo();
    render();
  }
}

function renderLance(){
  const p = GAME.temporadaState.partidaEmAndamento;
  const lance = p.lances[p.indiceLance];
  app.innerHTML = `
    ${statusBarHtml()}
    <div class="card">
      <div class="card-title">Lance da Partida (${p.indiceLance+1}/${p.lances.length}) — contra o ${p.adversario}</div>
      <div id="scene-text">${escapeHtml(lance.texto())}</div>
      <div class="choices">
        ${lance.escolhas.map((e,i)=>`<button class="btn" data-i="${i}">${escapeHtml(e.label)}</button>`).join('')}
      </div>
    </div>
  `;
  document.querySelectorAll('.choices .btn').forEach(btn => {
    btn.onclick = () => resolverEscolhaLance(lance.escolhas[parseInt(btn.dataset.i,10)]);
  });
}

function resolverEscolhaLance(escolha){
  const p = GAME.temporadaState.partidaEmAndamento;
  const ac = p.acumulado;
  const nivel = resolverNivelLance(escolha.attr, p.dificuldade);
  let texto = '';
  if(escolha.perfil === 'finalizar'){
    if(nivel==='otimo'){ ac.gols++; texto = 'Bola na rede! Um golaço seu.'; GAME.sociais.moral = clamp(GAME.sociais.moral+4,0,100); }
    else if(nivel==='bom'){ texto = 'Quase! A bola passou raspando a trave.'; }
    else if(nivel==='neutro'){ texto = 'O goleiro conseguiu encaixar a finalização.'; }
    else if(nivel==='ruim'){ ac.erros++; texto = 'Você chutou muito mal, a torcida reclamou.'; GAME.sociais.moral = clamp(GAME.sociais.moral-3,0,100); }
    else { ac.erros++; texto = 'Chute horrível, foi longe do gol. Frustração total.'; GAME.sociais.moral = clamp(GAME.sociais.moral-6,0,100); }
  } else if(escolha.perfil === 'passar'){
    if(nivel==='otimo'){ ac.assist++; texto = 'Passe perfeito — seu companheiro só empurrou para o gol!'; GAME.sociais.moral = clamp(GAME.sociais.moral+3,0,100); }
    else if(nivel==='bom'){ texto = 'Bom passe, mas o companheiro não conseguiu concluir.'; }
    else if(nivel==='neutro'){ texto = 'O passe chegou fraco e a defesa cortou.'; }
    else if(nivel==='ruim'){ ac.erros++; texto = 'Passe errado, perdeu a bola numa área perigosa.'; GAME.sociais.moral = clamp(GAME.sociais.moral-3,0,100); }
    else { ac.erros++; texto = 'Errou feio o passe e o adversário quase aproveitou no contra-ataque.'; GAME.sociais.moral = clamp(GAME.sociais.moral-6,0,100); }
  } else if(escolha.perfil === 'driblar'){
    if(nivel==='otimo'){ ac.gols++; texto = 'Driblou todo mundo e ainda balançou as redes! A torcida foi à loucura.'; GAME.sociais.moral = clamp(GAME.sociais.moral+6,0,100); atualizarRedesSociais(rand(20,60),'elogio'); }
    else if(nivel==='bom'){ texto = 'Ótimo drible, mas a jogada não terminou em gol.'; }
    else if(nivel==='neutro'){ texto = 'Tentou o drible, mas a defesa se recompôs a tempo.'; }
    else if(nivel==='ruim'){ ac.erros++; texto = 'Perdeu a bola no drible, torcida vaiou.'; GAME.sociais.moral = clamp(GAME.sociais.moral-4,0,100); }
    else { ac.erros++; texto = 'Perdeu a bola de forma feia bem no meio do campo, contra-ataque perigoso.'; GAME.sociais.moral = clamp(GAME.sociais.moral-7,0,100); }
  } else if(escolha.perfil === 'desarmar'){
    if(nivel==='otimo'){ texto = 'Desarme perfeito, cortou o perigo com autoridade.'; GAME.sociais.moral = clamp(GAME.sociais.moral+4,0,100); }
    else if(nivel==='bom'){ texto = 'Conseguiu tirar a bola, mas deu escanteio.'; }
    else if(nivel==='neutro'){ texto = 'O lance seguiu, sem grandes consequências.'; }
    else if(nivel==='ruim'){ ac.erros++; texto = 'Chegou atrasado no lance, deu falta perigosa perto da área.'; GAME.sociais.moral = clamp(GAME.sociais.moral-3,0,100); }
    else { ac.erros++; ac.amarelo++; texto = 'Errou o tempo da divida e ainda levou cartão amarelo.'; GAME.sociais.moral = clamp(GAME.sociais.moral-6,0,100); }
  } else if(escolha.perfil === 'arriscado'){
    if(nivel==='otimo' || nivel==='bom'){ ac.amarelo++; texto = 'A falta tática deu certo — cortou o contra-ataque, levando amarelo.'; }
    else { ac.erros++; ac.vermelho++; texto = 'A falta foi dura demais e você viu o cartão vermelho direto!'; GAME.sociais.moral = clamp(GAME.sociais.moral-10,0,100); }
  } else if(escolha.perfil === 'defender'){
    if(nivel==='otimo'){ ac.defesaImportante++; texto = 'Defesa espetacular! Você salvou o time sozinho.'; GAME.sociais.moral = clamp(GAME.sociais.moral+5,0,100); }
    else if(nivel==='bom'){ texto = 'Boa defesa, deu rebote mas o time conseguiu afastar.'; }
    else if(nivel==='neutro'){ texto = 'Defesa segura, sem sustos.'; }
    else if(nivel==='ruim'){ ac.erros++; texto = 'Não alcançou a bola — perigo real de gol.'; GAME.sociais.moral = clamp(GAME.sociais.moral-4,0,100); }
    else { ac.erros++; texto = 'Falhou feio e sofreu gol por causa do lance.'; GAME.sociais.moral = clamp(GAME.sociais.moral-8,0,100); }
  } else { // cauteloso
    if(nivel==='otimo' || nivel==='bom'){ texto = 'Escolha segura, o lance passou sem sobressaltos.'; }
    else if(nivel==='neutro'){ texto = 'Nada de especial aconteceu no lance.'; }
    else { ac.erros++; texto = 'Mesmo jogando com cautela, a bola sobrou mal e virou perigo.'; GAME.sociais.moral = clamp(GAME.sociais.moral-2,0,100); }
  }
  ac.eventos.push(texto);
  pushHistorico(`Lance na partida: ${escolha.label} — ${texto}`);

  // Erros demais no jogo podem tirar você de campo mais cedo (substituição)
  if(ac.erros >= 2 && !p.substituido && chance(35)){
    p.substituido = true;
    p.minutos = Math.max(15, Math.round(p.minutos * 0.55));
    ac.eventos.push('Depois de mais um erro, o técnico decidiu substituir você mais cedo.');
    ajustarSaudeMental(-4);
  }

  p.indiceLance += 1;
  salvarJogo();
  if(p.indiceLance >= p.lances.length){ finalizarPartida(); } else { render(); }
}

function finalizarPartida(){
  const p = GAME.temporadaState.partidaEmAndamento;
  const { status, adversario, entrouBanco, titular, ehGoleiro, ehDefensor } = p;
  let { minutos } = p;
  const ac = p.acumulado;
  const { gols, assist, erros, amarelo, vermelho, defesaImportante, eventos } = ac;

  // Um pouco de estatística "de fundo" para o resto da partida que não virou lance
  let finalizacoes = gols + (chance(40)?1:0);
  let desarmes = ehDefensor ? rand(0,3) : 0;
  let interceptacoes = ehDefensor ? rand(0,2) : 0;

  if(minutos > 0) checarLesao(Math.round(minutos/10));
  // Simula o resultado coletivo da partida (o time todo, não só você),
  // garantindo que os gols que você marcou entrem na conta do placar.
  const forcaTime = clamp(GAME.clube.nivelBase + (GAME.relacoes.elenco-50)*0.2 + (GAME.temporadaState.mediaTreinoRecente-50)*0.15 + rand(-12,12), 15, 95);
  const forcaAdversario = clamp(GAME.clube.reputacao*0.6 + rand(-15,20), 15, 95);
  function golsPoisson(forca){
    const lambda = clamp(forca/38, 0.2, 3.5);
    let n = 0;
    for(let i=0;i<6;i++){ if(chance(lambda/6*100)) n++; }
    return n;
  }
  let golsTime = golsPoisson(forcaTime);
  const golsAdversario = golsPoisson(forcaAdversario);
  // seus gols E suas assistências sempre entram no placar do time — cada assistência
  // é, por definição, um gol de um companheiro que você serviu
  if(golsTime < gols + assist) golsTime = gols + assist;
  const artilheiros = [];
  if(gols > 0) artilheiros.push({ nome:'Você', gols });
  function golPara(nome){
    const existente = artilheiros.find(a => a.nome === nome);
    if(existente) existente.gols++; else artilheiros.push({ nome, gols:1 });
  }
  // gols que vieram das SUAS assistências, atribuídos a um companheiro específico
  for(let i=0;i<assist;i++){
    golPara(GAME.elenco && GAME.elenco.length ? pick(GAME.elenco).nome : 'um companheiro');
  }
  // gols do time que não têm relação com você (nem seus, nem de suas assistências)
  let golsRestantes = golsTime - gols - assist;
  if(golsRestantes > 0 && GAME.elenco && GAME.elenco.length){
    for(let i=0;i<golsRestantes;i++) golPara(pick(GAME.elenco).nome);
  } else if(golsRestantes > 0){
    artilheiros.push({ nome:'Time', gols:golsRestantes });
  }
  const resultadoJogo = golsTime > golsAdversario ? 'vitoria' : golsTime < golsAdversario ? 'derrota' : 'empate';

  let nota = 0;
  if(minutos > 0){
    nota = 6.0 + gols*0.9 + assist*0.5 + defesaImportante*0.6 - erros*0.5 - amarelo*0.3 - vermelho*1.6 + rand(-3,3)/10;
    nota = clamp(nota, 0, 10);
  }

  // Atualiza estatísticas
  const s = GAME.stats;
  if(status !== 'naoRelacionado') s.jogos += 1;
  if(titular) s.titular += 1;
  if(entrouBanco) s.entrouBanco += 1;
  s.minutos += minutos;
  s.gols += gols; s.assistencias += assist; s.finalizacoes += finalizacoes;
  s.passesDecisivos += assist; s.desarmes += desarmes; s.interceptacoes += interceptacoes;
  s.amarelos += amarelo; s.vermelhos += vermelho;
  if(minutos > 0){ s.somaNotas += nota; s.notaMedia = s.somaNotas / Math.max(1, s.titular + s.entrouBanco); if(nota >= 8.5) s.melhorEmCampo += 1; }
  s.valorEstimado = Math.round(s.valorEstimado * (1 + (nota-6)*0.02 + gols*0.03 + assist*0.02));
  s.interesseClubes = clamp(s.interesseClubes + (nota>=7.5?4:0) + gols*3 + assist*2 - (vermelho*2), 0, 100);

  // Relações
  if(minutos>0){
    GAME.relacoes.torcida = clamp(GAME.relacoes.torcida + (nota>=7?6:nota<5?-4:1), 0, 100);
    GAME.relacoes.treinador = clamp(GAME.relacoes.treinador + (nota>=7?4:nota<5?-3:0), 0, 100);
    GAME.relacoes.midia = clamp(GAME.relacoes.midia + (nota>=7.5?5:0), 0, 100);
    GAME.sociais.moral = clamp(GAME.sociais.moral + (nota>=7?6:nota<5?-6:0), 0, 100);
    GAME.sociais.confianca = clamp(GAME.sociais.confianca + (nota>=7?5:nota<5?-5:0), 0, 100);
    GAME.sociais.popularidade = clamp(GAME.sociais.popularidade + gols*3 + assist*2, 0, 100);
    ajustarSaudeMental(nota>=7.5?5 : nota>=6?2 : nota<5?-5 : -1);
    const ganhoSeguidores = Math.round(gols*35 + assist*18 + (nota-6)*12 + rand(-8,15));
    atualizarRedesSociais(ganhoSeguidores, nota>=7.2 ? 'elogio' : nota<4.5 ? 'critica' : (chance(30)?'familia':null));
    if(GAME.social.seguidores >= 800 && !GAME.patrocinioAtual && chance(15)) atualizarRedesSociais(0, 'marca');
    concluirObjetivo('serRelacionado');
    if(s.jogos===1 && nota>=6.5) concluirObjetivo('boaEstreia');
    if(GAME.relacoes.treinador>=65) concluirObjetivo('boaRelacaoTreinador');
  } else if(status === 'naoRelacionado'){
    ajustarSaudeMental(-2);
  }
  GAME.status.energia = clamp(GAME.status.energia - Math.round(minutos/6), 0, 100);

  // O resultado coletivo também pesa um pouco nas relações, além do seu desempenho individual
  GAME.relacoes.torcida = clamp(GAME.relacoes.torcida + (resultadoJogo==='vitoria'?3:resultadoJogo==='derrota'?-3:0), 0, 100);
  GAME.sociais.moral = clamp(GAME.sociais.moral + (resultadoJogo==='vitoria'?3:resultadoJogo==='derrota'?-2:0), 0, 100);

  const resultado = {
    adversario, status, titular, entrouBanco, minutos, gols, assist, erros, amarelo, vermelho, defesaImportante, nota, eventos,
    golsTime, golsAdversario, resultadoJogo, artilheiros
  };

  // Notícia pós-jogo
  const placarTxt = `${golsTime}x${golsAdversario}`;
  if(status === 'naoRelacionado'){
    pushNoticia('treinador', `${GAME.identidade.apelido} ficou fora dos relacionados. ${GAME.clube.nome} ${placarTxt} ${adversario}.`);
  } else if(minutos === 0){
    pushNoticia('treinador', `${GAME.identidade.apelido} ficou no banco. ${GAME.clube.nome} ${placarTxt} ${adversario}.`);
  } else if(gols>0){
    pushNoticia('torcida', `${GAME.identidade.apelido} marca no ${GAME.clube.nome} ${placarTxt} ${adversario} e é aplaudido pela torcida!`);
  } else if(nota < 5){
    pushNoticia('midia', `Atuação apagada de ${GAME.identidade.apelido}. ${GAME.clube.nome} ${placarTxt} ${adversario}.`);
  } else {
    pushNoticia('geral', `${GAME.clube.nome} ${placarTxt} ${adversario} — ${GAME.identidade.apelido} atuou ${minutos} minutos, nota ${nota.toFixed(1)}.`);
  }

  GAME.temporadaState.jogoAtual = resultado;
  GAME.temporadaState.partidaEmAndamento = null;
  GAME.temporadaState.subFase = 'resultadoJogo';
  salvarJogo();
  render();
}

function renderResultadoJogo(){
  const j = GAME.temporadaState.jogoAtual;
  let statusTxt = j.status==='titular' ? 'Você foi titular.' : j.status==='reserva' ? (j.entrouBanco ? 'Você começou no banco e entrou durante o jogo.' : 'Você ficou no banco o jogo inteiro.') : 'Você não foi relacionado para este jogo.';
  let corpo = `${statusTxt}`;
  if(j.minutos>0){
    corpo += `\nMinutos em campo: ${j.minutos}.`;

  }
  const resultBadge = j.resultadoJogo==='vitoria' ? 'good' : j.resultadoJogo==='derrota' ? 'bad' : '';
  const resultLabel = j.resultadoJogo==='vitoria' ? 'Vitória' : j.resultadoJogo==='derrota' ? 'Derrota' : 'Empate';
  app.innerHTML = `
    ${statusBarHtml()}
    <div class="card">
      <div class="card-title">Resultado da Partida</div>

      <div class="spacer"></div>
      ${j.artilheiros.length ? `<p class="small muted">Gols do ${GAME.clube.nome}: ${j.artilheiros.map(a=>`${a.nome} (${a.gols})`).join(', ')}</p>` : ''}
      <div class="spacer"></div>
      <div id="scene-text">${escapeHtml(corpo).replace(/\n/g,'<br>')}</div>
      <div class="choices"><button class="btn btn-primary" id="btn-continuar-jogo">Continuar temporada</button></div>
    </div>
  `;
  document.getElementById('btn-continuar-jogo').onclick = () => { GAME.temporadaState.jogoAtual=null; avancarSemana(); };
}

function renderTemporada(){
  const ts = GAME.temporadaState;
  if(ts.subFase === 'lesao') renderLesao();
  else if(ts.subFase === 'evento') renderEvento();
  else if(ts.subFase === 'preJogo') renderPreJogo();
  else if(ts.subFase === 'lance') renderLance();
  else if(ts.subFase === 'resultadoJogo') renderResultadoJogo();
  else renderTreino();
  const btnPainel = document.getElementById('btn-abrir-painel');
  if(btnPainel) btnPainel.onclick = abrirPainel;

/* ================================= PAINEL ==================================
   Modal em abas, acessível a qualquer momento durante a peneira/temporada,
   sem interromper o estado do jogo (apenas leitura + botões de salvar/apagar).
   ========================================================================= */
const PAINEL_ABAS = ['dados','status','atributos','relacoes','estatisticas','contrato','social','noticias','historico','objetivos','calendario'];
const PAINEL_LABELS = {
  dados:'Dados', status:'Status', atributos:'Atributos', relacoes:'Relações',
  estatisticas:'Estatísticas', contrato:'Contrato', social:'Redes Sociais', noticias:'Notícias',
  historico:'Histórico', objetivos:'Objetivos', calendario:'Calendário'
};
let painelAbaAtiva = 'dados';

function abrirPainel(){
  const overlay = el(`<div id="panel-overlay"></div>`);
  overlay.innerHTML = `
    <div id="panel-modal">
      <div class="panel-header">
        <h2>Painel do Jogador</h2>
        <button class="btn btn-small" id="btn-fechar-painel">Fechar ✕</button>
      </div>
      <div class="tabs">${PAINEL_ABAS.map(a=>`<button class="tab-btn ${a===painelAbaAtiva?'active':''}" data-aba="${a}">${PAINEL_LABELS[a]}</button>`).join('')}</div>
      <div id="panel-body"></div>
      <div class="spacer"></div>
      <div class="row">
        <button class="btn btn-small" id="btn-salvar-manual">💾 Salvar</button>
        <button class="btn btn-small btn-danger" id="btn-apagar-carreira">Apagar carreira</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) fecharPainel(); });
  renderPainelBody();
  overlay.querySelectorAll('.tab-btn').forEach(b => {
    b.onclick = () => { painelAbaAtiva = b.dataset.aba; overlay.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); renderPainelBody(); };
  });
  document.getElementById('btn-fechar-painel').onclick = fecharPainel;
  document.getElementById('btn-salvar-manual').onclick = () => { salvarJogo(); alert('Carreira salva!'); };
  document.getElementById('btn-apagar-carreira').onclick = () => { if(confirm('Apagar toda a carreira atual?')){ apagarSave(); fecharPainel(); render(); } };
}
function fecharPainel(){ const o = document.getElementById('panel-overlay'); if(o) o.remove(); }

function renderPainelBody(){
  const body = document.getElementById('panel-body');
  if(!body) return;
  const fns = {
    dados: painelDados, status: painelStatus, atributos: painelAtributos,
    relacoes: painelRelacoes, estatisticas: painelEstatisticas, contrato: painelContrato,
    social: painelSocial, noticias: painelNoticias, historico: painelHistorico, objetivos: painelObjetivos,
    calendario: painelCalendario
  };
  body.innerHTML = fns[painelAbaAtiva]();
}

function painelDados(){
  const g = GAME;
  return `<div class="card">
    <p><b>Nome completo:</b> ${escapeHtml(g.identidade.nomeCompleto)}</p>
    <p><b>Chamado de:</b> ${escapeHtml(g.identidade.apelido)}</p>
    <p><b>Idade:</b> ${idadeAtual()} anos (nascido em ${fmtData(new Date(g.identidade.nascimento))})</p>
    <p><b>Naturalidade:</b> ${escapeHtml(g.identidade.cidadeNatal)}/${g.identidade.uf}</p>
    <p><b>Clube atual:</b> ${g.clube ? g.clube.nome : '—'}</p>

   Ao final das 17 semanas, calcula o desfecho da primeira temporada entre
   10 finais possíveis, com base em estatísticas, relações, lesões e no
   potencial oculto do jogador. Fácil de recalibrar os limiares abaixo.
   ========================================================================= */
const FINAIS = {
  pouco_utilizado: { titulo:'Aprovado, mas pouco utilizado',

  empresario_polemica: { titulo:'Empresário abre portas, mas gera polêmica',
    texto:(g)=>`${NOMES_EMPRESARIOS[g.empresarioAtual]} trouxe visibilidade ao seu nome, mas o relacionamento com a diretoria do ${g.clube.nome} ficou estremecido por causa disso. Portas se abriram, outras se fecharam.` },
  equilibrado_incerto: { titulo:'Temporada equilibrada, futuro incerto',
    texto:(g)=>`Nem grande revelação, nem decepção. Uma temporada de altos e baixos, com sinais de evolução, mas nada ainda garantido sobre o que vem a seguir.` },

    texto:(g)=>`Seu nome passou a ser conhecido além dos portões do CT. Torcedores comentam sobre você nas redes, a imprensa local já fez matérias — você virou, de fato, uma revelação regional.` },
  saude_mental_fragil: { titulo:'Talento real, mas a cabeça pesou',
    texto:(g)=>`Fisicamente você entregou o que podia, mas a pressão foi maior do que o esperado para alguém de 16 anos longe de casa. O ${g.clube.nome} entende, e reserva um espaço para você recuperar o equilíbrio antes da próxima temporada — o futebol vai esperar.` }
};

function calcularFinalTemporada(){
  const s = GAME.stats, r = GAME.relacoes;
  if(GAME.status.saudeMental <= 20) return 'saude_mental_fragil';
  if(s.lesoes >= 2) return 'lesao_atrapalhou';
  if(r.treinador < 35) return 'conflito_treinador';
  if(GAME.empresarioAtual && r.diretoria < 45) return 'empresario_polemica';
  if(GAME.stats.interesseClubes >= 70 && s.notaMedia >= 7.5) return 'promessa_serie_b_a';
  if(GAME.stats.interesseClubes >= 55 && s.notaMedia >= 7 && r.torcida >= 60) return 'revelacao_regional';
  if(s.titular >= 10 && s.notaMedia >= 7) return 'destaque_sub20';
  if(s.jogos >= 11 && s.notaMedia >= 6) return 'consolidado_base';
  if(s.jogos <= 5) return 'pouco_utilizado';
  return 'equilibrado_incerto';
}

function finalizarTemporada(){
  GAME.fase = 'fim';
  GAME.finalTipo = calcularFinalTemporada();
  // ajuste final do potencial oculto com base no desempenho da temporada
  const s = GAME.stats;
  let ajuste = (s.notaMedia-6)*4 + s.gols*1.5 + s.assistencias*1 + (GAME.relacoes.treinador-50)*0.2 - s.lesoes*5 + (GAME.atributos.ambicao-50)*0.15;
  GAME.potencialOculto = clamp(Math.round(GAME.potencialOculto + ajuste), 1, 99);
  if(s.notaMedia >= 6.5) concluirObjetivo('evolucaoPositiva');
  salvarJogo();
  render();
}

/* ============================== TEMPORADA 2+ =================================
   Entressafra: recapitulação, renovação de contrato e (se o desempenho abrir
   a porta) proposta de transferência para um clube maior — antes de envelhecer
   o jogador em 1 ano e iniciar a temporada seguinte, mantendo atributos,
   relações e histórico de carreira.
   ========================================================================= */
const OBJETIVOS_TEMPORADA_SEGUINTE = [
  ['evoluir5','Melhorar 5 pontos em algum atributo'],
  ['serTitularRegular','Ser titular em pelo menos 8 jogos'],
  ['boaRelacaoTreinador','Manter boa relação com o treinador'],
  ['evolucaoPositiva','Encerrar a temporada com evolução positiva'],
  ['cuidarSaudeMental','Manter a saúde mental estável (acima de 50) a temporada toda']
];

function calcularOfertaContrato(){
  const s = GAME.stats, c = GAME.contrato;
  const desempenho = clamp((s.notaMedia-6)*10 + (GAME.relacoes.diretoria-50)*0.3 + (s.interesseClubes-40)*0.2, -30, 45);
  const bolsaBase = c.bolsa > 0 ? c.bolsa : 300;
  const novaBolsa = Math.max(150, Math.round(bolsaBase * (1 + desempenho/100 + 0.12)));
  const novaExpectativa = desempenho > 15 ? 'Alta' : desempenho > -5 ? 'Moderada' : 'Baixa';
  const novoTipo = novaBolsa >= 1000 ? 'Contrato profissional júnior' : novaBolsa >= 500 ? 'Contrato de base' : 'Bolsa auxílio';
  return { tipo:novoTipo, bolsa:novaBolsa, duracao:12, expectativa:novaExpectativa,
    confiancaDiretoria: clamp(c.confiancaDiretoria + Math.round(desempenho/4), 10, 95) };
}
function clubesMaioresDisponiveis(){
  if(!(GAME.stats.interesseClubes >= 55 && GAME.stats.notaMedia >= 6.8)) return [];
  return CLUBES.filter(c => c.reputacao > GAME.clube.reputacao + 8 && c.id !== GAME.clube.id)
    .sort((a,b) => b.reputacao-a.reputacao).slice(0,2);
}

function iniciarEntressafra(){
  GAME.fase = 'entressafra';
  GAME.entressafraState = { etapa:0, ofertaContrato:null };
  salvarJogo();
  render();
}

function renderEntressafra(){
  const st = GAME.entressafraState;
  if(st.etapa === 0) return renderEntressafraRecap();
  if(st.etapa === 1) return renderEntressafraContrato();
  if(st.etapa === 2) return renderEntressafraTransferencia();
  return renderEntressafraFinal();
}

      <div class="choices"><button class="btn btn-primary" id="btn-ent-continuar">Continuar</button></div>
    </div>
  `;
  document.getElementById('btn-ent-continuar').onclick = () => { GAME.entressafraState.etapa = 1; salvarJogo(); render(); };

/* ---------------------- NEGOCIAÇÃO DE CONTRATO (multi-rodada) ---------------
   O dirigente tem um "humor" (0-100) que muda a cada rodada conforme sua
   postura. O jogo é real: blefe sem estatística pra sustentar sai caro,
   ameaças de saída só funcionam se houver de fato interesse de fora.
   ------------------------------------------------------------------------- */
function humorDirigenteLabel(h){
  if(h >= 75) return 'satisfeito, sorrindo — a conversa está fácil';
  if(h >= 50) return 'tranquilo, ouvindo com atenção';
  if(h >= 30) return 'de braços cruzados, meio impaciente';
  return 'visivelmente irritado, checando o relógio';
}
function iniciarNegociacaoContrato(){
  const base = calcularOfertaContrato();
  GAME.entressafraState.negociacao = {
    dirigente: pick(NOMES_DIRIGENTES),
    bolsa: base.bolsa, duracao: base.duracao, expectativa: base.expectativa, tipo: base.tipo,
    confiancaDiretoria: base.confiancaDiretoria,
    humor: clamp(50 + (GAME.relacoes.diretoria-50)*0.4 + (GAME.stats.notaMedia-6)*5 + rand(-8,8), 5, 95),
    rodada: 0
  };
}

function renderEntressafraContrato(){
  const st = GAME.entressafraState;
  if(!st.negociacao) iniciarNegociacaoContrato();
  const n = st.negociacao;
  const ultimaRodada = n.rodada >= 3;
  const introducao = n.rodada === 0
    ? `${n.dirigente} chama você para conversar sobre o próximo ano.\n\n— Analisamos sua temporada. Podemos seguir com um ${n.tipo.toLowerCase()}, R$ ${n.bolsa.toLocaleString('pt-BR')} por mês. O que acha?`
    : `${n.dirigente} está ${humorDirigenteLabel(n.humor)}.\n\n— Certo. Nossa proposta agora é R$ ${n.bolsa.toLocaleString('pt-BR')} por mês, ${n.duracao} meses de contrato.`;
  const podeAmeacar = clubesMaioresDisponiveis().length > 0;
  const escolhas = [
    { label:'Aceitar os termos atuais', acao:'aceitar' },
    ...(!ultimaRodada ? [
      { label:'Pedir um aumento no salário', acao:'pedir_aumento' },
      { label:'Pedir um contrato mais longo', acao:'pedir_prazo' },
      { label:'Destacar seus números da temporada', acao:'destacar_stats' },
      ...(podeAmeacar ? [{ label:'Insinuar que tem interesse de outros clubes', acao:'ameacar_sair' }] : []),
      ...(GAME.empresarioAtual ? [{ label:'Deixar seu empresário conduzir a conversa', acao:'usar_empresario' }] : [])
    ] : [])
  ];
  app.innerHTML = `
    <div class="card">
      <div class="card-title">Renovação de Contrato ${n.rodada>0 ? `— rodada ${n.rodada+1}` : ''}</div>
      <div id="scene-text">${escapeHtml(introducao).replace(/\n/g,'<br>')}</div>
      <div class="choices">${escolhas.map((e,i)=>`<button class="btn ${e.acao==='aceitar'?'btn-primary':''}" data-i="${i}">${escapeHtml(e.label)}</button>`).join('')}</div>
    </div>
  `;
  document.querySelectorAll('.choices .btn').forEach(btn => {
    btn.onclick = () => {
      const esc = escolhas[parseInt(btn.dataset.i,10)];
      resolverRodadaNegociacao(esc.acao);
    };
  });
}

function resolverRodadaNegociacao(acao){
  const st = GAME.entressafraState;
  const n = st.negociacao;
  if(acao === 'aceitar'){
    GAME.contrato = { tipo:n.tipo, bolsa:n.bolsa, duracao:n.duracao, expectativa:n.expectativa, confiancaDiretoria:n.confiancaDiretoria };
    pushNoticia('geral', `${GAME.identidade.apelido} renova com o ${GAME.clube.nome}: ${n.tipo}, R$ ${n.bolsa.toLocaleString('pt-BR')}/mês.`);
    GAME.entressafraState.etapa = 2;
    salvarJogo(); render();
    return;
  }
  if(acao === 'pedir_aumento'){
    const chanceSucesso = clamp(n.humor*0.7 + (GAME.stats.notaMedia-6)*8, 5, 90);
    if(chance(chanceSucesso)){ n.bolsa = Math.round(n.bolsa*1.15); n.humor = clamp(n.humor-4,0,100); }
    else { n.humor = clamp(n.humor-14,0,100); }
  } else if(acao === 'pedir_prazo'){
    const chanceSucesso = clamp(n.humor*0.8, 5, 90);
    if(chance(chanceSucesso)){ n.duracao += 6; n.humor = clamp(n.humor-2,0,100); }
    else { n.humor = clamp(n.humor-8,0,100); }
  } else if(acao === 'destacar_stats'){
    const boaTemporada = GAME.stats.notaMedia >= 6.8 || GAME.stats.gols+GAME.stats.assistencias >= 6;
    if(boaTemporada){ n.bolsa = Math.round(n.bolsa*1.12); n.humor = clamp(n.humor+10,0,100); }
    else { n.humor = clamp(n.humor-16,0,100); } // blefe sem número que sustente sai caro
  } else if(acao === 'ameacar_sair'){
    if(n.humor >= 45 && chance(55)){ n.bolsa = Math.round(n.bolsa*1.25); n.humor = clamp(n.humor-10,0,100); }
    else { n.humor = clamp(n.humor-25,0,100); n.confiancaDiretoria = clamp(n.confiancaDiretoria-10,0,100); }
  } else if(acao === 'usar_empresario'){
    const tipo = GAME.empresarioAtual;
    if(tipo === 'experiente'){ n.bolsa = Math.round(n.bolsa*1.2); n.humor = clamp(n.humor+5,0,100); }
    else if(tipo === 'amigoFamilia'){ n.bolsa = Math.round(n.bolsa*1.08); n.humor = clamp(n.humor+3,0,100); }
    else if(tipo === 'oportunista'){ if(chance(50)){ n.bolsa = Math.round(n.bolsa*1.3); n.humor = clamp(n.humor-5,0,100); } else { n.humor = clamp(n.humor-20,0,100); } }
    else { if(chance(40)){ n.bolsa = Math.round(n.bolsa*1.15); } else { n.humor = clamp(n.humor-15,0,100); } }
  }
  n.rodada += 1;
  // se o humor despenca, a diretoria endurece de vez e força o encerramento
  if(n.humor <= 0){
    n.bolsa = Math.round(n.bolsa*0.9);
    GAME.contrato = { tipo:n.tipo, bolsa:n.bolsa, duracao:n.duracao, expectativa:'Baixa', confiancaDiretoria:clamp(n.confiancaDiretoria-15,0,100) };
    pushNoticia('geral', `A negociação com o ${GAME.clube.nome} esfriou. Contrato fechado em termos piores do que o esperado.`);
    GAME.entressafraState.etapa = 2;
    salvarJogo(); render();
    return;
  }
  if(n.rodada > 3){
    GAME.contrato = { tipo:n.tipo, bolsa:n.bolsa, duracao:n.duracao, expectativa:n.expectativa, confiancaDiretoria:n.confiancaDiretoria };
    pushNoticia('geral', `${GAME.identidade.apelido} fecha a renovação com o ${GAME.clube.nome} depois de uma negociação longa.`);
    GAME.entressafraState.etapa = 2;
  }
  salvarJogo();
  render();
}

function renderEntressafraTransferencia(){
  const opcoes = clubesMaioresDisponiveis();
  if(opcoes.length === 0){
    app.innerHTML = `
      <div class="card">
        <div class="card-title">Mercado</div>
        <div id="scene-text">Nenhum clube maior de olho em você ainda — ao menos por enquanto. É hora de seguir firme e continuar evoluindo no ${GAME.clube.nome}.</div>
        <div class="choices"><button class="btn btn-primary" id="btn-ent-seguir">Continuar</button></div>
      </div>
    `;
    document.getElementById('btn-ent-seguir').onclick = () => { GAME.entressafraState.etapa = 3; salvarJogo(); render(); };
    return;
  }
  const texto = `Seu bom momento chamou atenção além do ${GAME.clube.nome}. ${opcoes.length>1?'Dois clubes maiores':'Um clube maior'} sinalizaram interesse em te contratar para a próxima temporada.`;
  app.innerHTML = `
    <div class="card">
      <div class="card-title">Proposta de Transferência</div>
      <div id="scene-text">${escapeHtml(texto)}</div>
      <div class="choices">
        ${opcoes.map((c,i) => `<button class="btn" data-i="${i}">Transferir para o ${c.nome} — ${c.divisao} (${c.cidade}/${c.uf})</button>`).join('')}
        <button class="btn btn-primary" data-i="ficar">Permanecer no ${GAME.clube.nome} (${GAME.clube.divisao})</button>
      </div>
    </div>
  `;
  document.querySelectorAll('.choices .btn').forEach(btn => {
    btn.onclick = () => {
      if(btn.dataset.i !== 'ficar'){
        const novoClube = opcoes[parseInt(btn.dataset.i,10)];
        GAME.clube = { id:novoClube.id, nome:novoClube.nome, cidade:novoClube.cidade, uf:novoClube.uf,
          divisao:novoClube.divisao, estiloJogo:novoClube.estiloJogo, nivelBase:novoClube.nivelBase,
          chanceAprovacaoBase:novoClube.chanceAprovacaoBase, pressaoTorcida:novoClube.pressaoTorcida,
          oportunidadeJovens:novoClube.oportunidadeJovens, financeiro:novoClube.financeiro,
          reputacao:novoClube.reputacao, exigenciaPeneira:novoClube.exigenciaPeneira,
          cor1:novoClube.cor1, cor2:novoClube.cor2 };
        GAME.tecnico = pick(NOMES_TECNICOS);
        GAME.observador = pick(NOMES_OBSERVADORES);
        GAME.elenco = gerarElenco(); // novo clube, novos companheiros de elenco
        GAME.relacoes.treinador = 50; GAME.relacoes.elenco = 50; GAME.relacoes.diretoria = 50; GAME.relacoes.torcida = 15;
        GAME.status.statusElenco = 'Novo reforço';
        pushNoticia('midia', `${GAME.identidade.apelido} é anunciado como novo reforço do ${novoClube.nome} (${novoClube.divisao})!`);
      }
      GAME.entressafraState.etapa = 3;
      salvarJogo();
      render();
    };
  });
}

function renderEntressafraFinal(){
  app.innerHTML = `
    <div class="card">
      <div class="card-title">Pronto para a Temporada ${GAME.numeroTemporada+1}</div>
      <div id="scene-text">Mais um ano, mais uma chance de provar seu valor no ${GAME.clube.nome}. A pré-temporada está prestes a começar.</div>
      <div class="choices"><button class="btn btn-primary" id="btn-comecar-proxima">Começar a Temporada ${GAME.numeroTemporada+1}</button></div>
    </div>
  `;
  document.getElementById('btn-comecar-proxima').onclick = avancarParaProximaTemporada;
}

function avancarParaProximaTemporada(){
  // Envelhece o jogador em 1 ano (ajustando a data de nascimento guardada)
  const nasc = new Date(GAME.identidade.nascimento);
  GAME.identidade.nascimento = new Date(nasc.getFullYear()-1, nasc.getMonth(), nasc.getDate()).toISOString();

  // Arquiva as estatísticas da temporada que terminou no histórico de carreira
  if(!GAME.statsCareer) GAME.statsCareer = { jogos:0, gols:0, assistencias:0, minutos:0, titular:0, temporadas:0 };
  GAME.statsCareer.jogos += GAME.stats.jogos;
  GAME.statsCareer.gols += GAME.stats.gols;
  GAME.statsCareer.assistencias += GAME.stats.assistencias;
  GAME.statsCareer.minutos += GAME.stats.minutos;
  GAME.statsCareer.titular += GAME.stats.titular;
  GAME.statsCareer.temporadas += 1;

  GAME.numeroTemporada += 1;
  GAME.stats = {
    jogos:0, titular:0, entrouBanco:0, minutos:0, gols:0, assistencias:0,
    finalizacoes:0, passesDecisivos:0, desarmes:0, interceptacoes:0,
    amarelos:0, vermelhos:0, lesoes:0, somaNotas:0, notaMedia:0,
    melhorEmCampo:0, valorEstimado:GAME.stats.valorEstimado, interesseClubes:Math.round(GAME.stats.interesseClubes*0.7)
  };
  GAME.objetivos = OBJETIVOS_TEMPORADA_SEGUINTE.map(([id,t]) => novoObjetivo(id,t));
  GAME.lesaoAtual = null;
  GAME.finalTipo = null;
  GAME.entressafraState = null;

  // pequena renovação natural do círculo de amigos: chance de alguém sair e outro chegar
  if(GAME.elenco && GAME.elenco.length && chance(30)){
    const saiu = pick(GAME.elenco);
    GAME.elenco = GAME.elenco.filter(c => c.id !== saiu.id);
    const nomesAtuais = GAME.elenco.map(c=>c.nome);
    const novosNomes = NOMES_COMPANHEIROS.filter(n => !nomesAtuais.includes(n));
    if(novosNomes.length){
      GAME.elenco.push({ id:'comp_'+GAME.status.semanaGlobal, nome:pick(novosNomes), papel:pick(PAPEIS_ELENCO), relacao:50 });
    }
    pushNoticia('geral', `${saiu.nome} deixou o elenco. Um novo companheiro chegou para a Temporada ${GAME.numeroTemporada}.`);
  }

  pushNoticia('geral', `Início da Temporada ${GAME.numeroTemporada} — agora com ${idadeAtual()} anos.`);
  iniciarTemporada();
}

/* ================================== INIT ==================================== */
(function init(){
  render();
})();
</script>
